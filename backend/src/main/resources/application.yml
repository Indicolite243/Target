server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: stock-manager-backend
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/stock_manager?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
    mongodb:
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/stock_manager}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:1800}
  quant-service:
    base-url: ${QUANT_SERVICE_URL:http://127.0.0.1:8000/internal/v1}
    internal-token: ${QUANT_INTERNAL_TOKEN:development-internal-token}
  snapshot:
    enabled: ${ACCOUNT_SNAPSHOT_ENABLED:true}
    account-sync-interval-ms: ${ACCOUNT_SNAPSHOT_ACCOUNT_SYNC_INTERVAL_MS:30000}
    mongodb-interval-ms: ${ACCOUNT_SNAPSHOT_MONGODB_INTERVAL_MS:300000}
    daily-cron: ${ACCOUNT_SNAPSHOT_DAILY_CRON:0 10 15 * * MON-FRI}
    initial-delay-ms: ${ACCOUNT_SNAPSHOT_INITIAL_DELAY_MS:10000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
